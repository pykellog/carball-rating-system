<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFS Gaming CarBall Player Rankings</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    
    <style>
        :root {
            --bg-base: #09090b; 
            --bg-card: rgba(18, 18, 20, 0.88);
            --bg-hover: rgba(28, 28, 32, 0.9);
            --accent-green: #10b981; 
            --accent-glow: rgba(16, 185, 129, 0.15);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
            --purple: #c084fc;
            
            --tier-s: #fbbf24; --tier-a: #c084fc; --tier-b: #38bdf8;
            --tier-c: #4ade80; --tier-d: #f87171; --tier-e: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; 
            background-color: var(--bg-base);
            font-family: 'Inter', sans-serif; color: var(--text-main); -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            background-image: 
                radial-gradient(circle at center, rgba(9, 9, 11, 0.2) 0%, rgba(9, 9, 11, 0.6) 100%),
                linear-gradient(to bottom, rgba(9, 9, 11, 0.2), rgba(9, 9, 11, 0.4)),
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 70%),
                url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: translateZ(0);
            pointer-events: none;
        }

        .app-container { 
            position: relative; z-index: 1;
            display: flex; flex-direction: column; height: 100vh; max-width: 1400px; margin: 0 auto; padding: 1.25rem; 
        }

        .hero { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
        .hero h1 { 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 2.3rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            background: linear-gradient(120deg, #e7a922 0%, #ffffff 50%, #4d4d4d 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 2px 10px rgba(251, 191, 36, 0.2));
            margin: 0; 
        }
        .hero-stats { display: flex; gap: 1rem; background: var(--bg-card); padding: 0.4rem 1rem; border-radius: 100px; border: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
        .hero-stats strong { color: var(--text-main); }

        .controls-wrapper { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; background: var(--bg-card); padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--border-color); }
        .search-box { position: relative; flex-grow: 1; max-width: 320px; }
        .search-box input { width: 100%; padding: 0.45rem 1rem 0.45rem 2.2rem; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-color); border-radius: 6px; color: white; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
        .search-box input:focus { outline: none; border-color: var(--accent-green); }
        .search-box::before { content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 0.8rem; }
        
        .filter-btn { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.2); padding: 0.45rem 0.9rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: background 0.15s ease; display: flex; align-items: center; gap: 0.2rem; line-height: 1; text-decoration: none !important; }
        .filter-btn:hover { background: rgba(16, 185, 129, 0.2); }
        .filter-btn.active { background: var(--accent-green); color: #000; }
        .filter-btn .count { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 10px; line-height: 1; font-size: 0.75rem; }
        
        .guide-btn {
            background: rgba(231, 169, 34, 0.15) !important;
            color: #e7a922 !important;
            border-color: rgba(231, 169, 34, 0.3) !important;
        }
        .guide-btn:hover {
            background: rgba(231, 169, 34, 0.25) !important;
            border-color: rgba(231, 169, 34, 0.5) !important;
        }

        .table-wrapper { flex-grow: 1; min-height: 0; background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; transform: translateZ(0); }
        .table-scroll-container { flex-grow: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .table-scroll-container::-webkit-scrollbar { display: none; }

        table.dataTable { width: 100% !important; margin: 0 !important; border-collapse: collapse !important; font-family: 'Inter', sans-serif; }
        table.dataTable thead { position: sticky; top: 0; z-index: 10; background: #0c0c0e; }
        table.dataTable thead th { 
            color: var(--text-muted) !important; 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 0.9rem !important; 
            font-weight: 700; 
            text-transform: uppercase; 
            padding: 0.6rem 0.3rem !important; 
            border-bottom: 1px solid var(--border-color) !important; 
            white-space: nowrap; 
            cursor: default; 
        }
        table.dataTable tbody tr { border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; background: transparent !important; transition: background 0.15s ease; }
        table.dataTable tbody tr:hover { background-color: var(--bg-hover) !important; }
        table.dataTable tbody tr.changed-player { background-color: rgba(251, 191, 36, 0.05) !important; }
        table.dataTable td { 
            padding: 0.5rem 0.3rem !important; 
            vertical-align: middle; 
            border: none !important; 
            font-size: 1rem !important;
            font-weight: 500; 
            white-space: nowrap; 
        }

        .col-rank { 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 1.15rem; 
            font-weight: 700; 
            color: var(--text-muted); 
            text-align: center !important; 
            width: 35px; 
        }
        .col-player { 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            width: 230px;
            min-width: 160px;
            max-width: 280px;
        }
        .player-info { 
            display: flex; 
            flex-direction: column; 
            line-height: 1.1; 
        }
        .player-nick { 
            font-weight: 700; 
            font-size: 0.95rem; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            white-space: nowrap;
        }
        .player-trend-icon {
            font-size: 0.85rem;
            margin-left: 2px;
            cursor: default;
        }
        .player-user { 
            font-size: 0.7rem; 
            color: var(--text-muted); 
            margin-top: 1px; 
        }
        .player-user a { color: var(--text-muted); text-decoration: none; transition: color 0.15s ease; }
        .player-user a:hover { color: var(--accent-green); }

        .col-role-emojis { 
            text-align: center; 
            font-size: 1.3rem; 
            letter-spacing: 3px; 
            width: 85px; 
            cursor: default;
        }
        .col-role-emojis span { 
            display: inline-block;
            transition: transform 0.15s ease;
        }
        .col-role-emojis span:hover {
            transform: scale(1.2);
        }
        
        .col-stat { 
            text-align: center; 
            font-family: 'Rajdhani', sans-serif; 
            font-weight: 600; 
            font-size: 1.05rem; 
        }
        .col-win { 
            text-align: center; 
            font-family: 'Rajdhani', sans-serif; 
            font-weight: 600; 
            font-size: 1.05rem; 
        }
        .col-loss { 
            text-align: center; 
            font-family: 'Rajdhani', sans-serif; 
            font-weight: 600; 
            font-size: 1.05rem; 
        }

        .change-tag { display: inline-flex; align-items: center; padding: 1px 3px; border-radius: 3px; font-size: 0.65rem; font-weight: 700; }
        .change-tag.up { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .change-tag.down { background: rgba(248, 113, 113, 0.15); color: #f87171; }
        .change-tag.new { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .change-text-up { color: var(--accent-green) !important; }
        .change-text-down { color: #f87171 !important; }

        /* === DETAILS PANEL === */
        table.dataTable tbody tr.expanded-row-bg { background-color: rgba(0,0,0,0.75) !important; }
        .details-wrapper { padding: 0.8rem 1rem; background: rgba(5, 5, 6, 0.6); }
        .details-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 0.8rem; 
        }
        
        .stat-card { 
            background: #121215; 
            border-radius: 8px; 
            border: 1px solid var(--border-color); 
            border-top: 3px solid; 
            padding: 0.7rem; 
            position: relative; 
            overflow: hidden;
        }
        
        .card-core { border-top-color: #f97316; }
        .card-scoring { border-top-color: #f87171; }
        .card-playmaking { border-top-color: #fbbf24; }
        .card-defense { border-top-color: #38bdf8; }
        .card-advanced { border-top-color: #c084fc; }

        .card-header { 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 1rem; 
            font-weight: 700; 
            color: white; 
            display: flex; 
            align-items: center; 
            gap: 6px; 
            margin-bottom: 0.4rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            padding-bottom: 0.3rem; 
        }
        .stat-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 2px 0; 
            border-bottom: 1px dashed rgba(255,255,255,0.03); 
            font-size: 0.85rem; 
            position: relative;
            cursor: default;
        }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { 
            color: var(--text-muted); 
            display: flex; 
            align-items: center; 
            gap: 4px; 
            font-size: 0.8rem; 
            cursor: default;
        }
        .stat-val { 
            font-family: 'Rajdhani', sans-serif; 
            font-weight: 700; 
            font-size: 0.95rem; 
        }

        /* === TOOLTIP === */
        .metric-tooltip {
            position: fixed;
            z-index: 9999;
            background: #1a1a1e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            max-width: 420px;
            min-width: 250px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            background: rgba(20, 20, 24, 0.95);
            pointer-events: none;
            transition: opacity 0.15s ease;
            opacity: 0;
        }
        .metric-tooltip.visible {
            opacity: 1;
        }
        .metric-tooltip .tt-header {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: white;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .metric-tooltip .tt-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 6px;
        }
        .metric-tooltip .tt-formula-wrapper {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }
        .metric-tooltip .tt-formula {
            font-size: 0.7rem;
            color: var(--blue);
            font-family: 'Rajdhani', sans-serif;
            background: rgba(56,189,248,0.08);
            padding: 2px 10px;
            border-radius: 4px;
            display: inline-block;
            border: 1px solid rgba(56,189,248,0.1);
        }

        .table-footer { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem; background: #0c0c0e; border-top: 1px solid var(--border-color); }
        .dataTables_wrapper .dataTables_filter, .dataTables_wrapper .dataTables_length, .dataTables_info, .dataTables_paginate { display: none !important; }
        
        .app-footer { flex-shrink: 0; text-align: center; margin-top: 0.75rem; color: rgba(255,255,255,0.6); font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center;}
        .app-footer a { color: var(--accent-green); text-decoration: none; font-weight: 500; }
        .app-footer a:hover { text-decoration: underline; }
        
        .expand-icon { font-size: 11px; color: var(--text-muted); transition: transform 0.15s ease; display: inline-block; }
        tr.shown .expand-icon { transform: rotate(90deg); color: var(--accent-green); }
        
        @media (max-width: 1100px) {
            .details-grid { grid-template-columns: repeat(3, 1fr); }
            .col-player { width: 170px; min-width: 130px; }
        }
        @media (max-width: 800px) {
            .details-grid { grid-template-columns: repeat(2, 1fr); }
            .col-role-emojis { width: 60px; font-size: 1rem; letter-spacing: 2px; }
            .col-player { width: 130px; min-width: 100px; }
            .player-nick { font-size: 0.8rem; }
            .player-user { font-size: 0.6rem; }
        }
        @media (max-width: 600px) {
            .details-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 1.4rem; }
            .hero-stats { font-size: 0.65rem; padding: 0.2rem 0.6rem; }
            .controls-wrapper { flex-wrap: wrap; gap: 0.5rem; }
            .search-box { max-width: 100%; width: 100%; }
            .col-role-emojis { width: 50px; font-size: 0.8rem; letter-spacing: 1px; }
            .metric-tooltip { max-width: 280px; min-width: 200px; }
            .col-player { width: 100px; min-width: 70px; }
            table.dataTable td { font-size: 0.8rem !important; padding: 0.3rem 0.2rem !important; }
            .player-nick { font-size: 0.7rem; }
            .player-user { font-size: 0.5rem; }
            .player-trend-icon { font-size: 0.7rem; }
        }
    </style>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="adefbdcd-a363-4714-8f6d-86f7cd379c8c"></script>
</head>
<body>

<div class="app-container">
    
    <div class="hero">
        <h1>CarBall Rankings</h1>
        <div class="hero-stats">
            <div><span style="color: #ebebeb;" id="playerCount">0</span> Players on Field</div>
            <div>Last Update: <span style="color: #ebebeb;" id="lastUpdate">-</span></div>
        </div>
    </div>

    <div class="controls-wrapper">
        <div class="search-box">
            <input type="text" id="customSearch" placeholder="Search a player...">
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="filter-btn" id="filterChangedBtn" onclick="toggleFilter()">
                📊 Changes <span class="count" id="changedCount">0</span>
            </button>
            <a href="cbinfo.html" target="_blank" class="filter-btn guide-btn">
                📖 Metric Guide
            </a>
            <a href="https://github.com/pykellog/carball-rating-system" target="_blank" class="filter-btn" style="background: transparent; color: white; border-color: rgba(255,255,255,0.2);">
                GitHub
            </a>
        </div>
    </div>

    <div class="table-wrapper">
        <div class="table-scroll-container" id="tableScrollContainer">
            <table id="playersTable" class="display">
                <thead>
                    <tr>
                        <th class="col-rank" title="Leaderboard Position">#</th>
                        <th title="Player nickname">Player</th>
                        <th style="text-align: center;" title="Player's top 3 roles (best to worst)">Role</th>
                        <th style="text-align: center;" title="Total matches played">Matches</th>
                        <th style="text-align: center;" title="Total matches won">Wins</th>
                        <th style="text-align: center;" title="Total matches lost">Losses</th>
                        <th style="text-align: center;" title="Win Rate (%)">Win %</th>
                        <th style="text-align: center;" title="Total goals scored">Goals</th>
                        <th style="text-align: center;" title="Total assists provided">Assists</th>
                        <th style="text-align: center;" title="Total saves made">Saves</th>
                        <th style="text-align: center;" title="Total Most Valuable Player awards">MVP</th>
                        <th style="text-align: center;" title="Goals per match">G/M</th>
                        <th style="text-align: center;" title="Assists per match">A/M</th>
                        <th style="text-align: center;" title="Saves per match">S/M</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="table-footer" id="customPagination"></div>
    </div>
    
    <div class="app-footer" style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;">
        <div>Data sourced from <strong>FFS Gaming</strong> MTA server.</div>
        <div id="footerUpdate">Previous Update: -</div>
        <div style="font-size: 0.7rem; color: rgba(255,255,255,0.4);">
            Designed & Built by 
            <span style="background: linear-gradient(120deg, #465828, #e5f9cf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600;">"keLLog</span>
        </div>
    </div>
</div>

<!-- Tooltip Container -->
<div class="metric-tooltip" id="metricTooltip">
    <div class="tt-header" id="ttHeader">📊 Metric Name</div>
    <div class="tt-desc" id="ttDesc">Description of the metric</div>
    <div class="tt-formula-wrapper">
        <div class="tt-formula" id="ttFormula">Formula: X ÷ Y</div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
// ============================================================
// METRİK TANIMLARI (36 Metrik)
// ============================================================
const metricDefinitions = {
    'Win Rate': {
        icon: '🏆',
        description: 'Percentage of matches won. Above 50% means you actively change game outcomes.',
        formula: 'Won ÷ Total Matches'
    },
    'Loss Rate': {
        icon: '📉',
        description: 'Percentage of matches lost. High rate doesn\'t mean bad player—bad teams happen.',
        formula: 'Lost ÷ Total Matches'
    },
    'Win / Loss Ratio': {
        icon: '⚖️',
        description: 'Wins per 1 loss. Below 1 = losing more than winning.',
        formula: 'Won ÷ Lost'
    },
    'Loss / Win Ratio': {
        icon: '📊',
        description: 'Losses per 1 win. Shows how much grind is needed for victory.',
        formula: 'Lost ÷ Won'
    },
    'Goals / Match': {
        icon: '⚽',
        description: 'Average goals scored per match. 1.0+ is elite striker territory.',
        formula: 'Total Goals ÷ Total Matches'
    },
    'Assists / Match': {
        icon: '🤝',
        description: 'Average assists per match. High = playmaker / team player.',
        formula: 'Total Assists ÷ Total Matches'
    },
    'Saves / Match': {
        icon: '🧤',
        description: 'Average saves per match. Above 1.5 = goalkeeper / defensive anchor.',
        formula: 'Total Saves ÷ Total Matches'
    },
    'Total Actions': {
        icon: '🎬',
        description: 'Total positive contributions (Goals + Assists + Saves). Overall workload.',
        formula: 'Goals + Assists + Saves'
    },
    'Actions / Match': {
        icon: '⚙️',
        description: 'Activity level per match. 2.5+ = always involved.',
        formula: 'Total Actions ÷ Total Matches'
    },
    'Total Contributions': {
        icon: '🎯',
        description: 'Total offensive production (Goals + Assists). Attacking impact.',
        formula: 'Goals + Assists'
    },
    'Contributions / Match': {
        icon: '📊',
        description: 'Offensive contributions per match. Guaranteed scoring involvement.',
        formula: 'Total Contributions ÷ Total Matches'
    },
    'Striker Ratio': {
        icon: '🗡️',
        description: 'Percentage of offensive actions that are goals. High = finisher.',
        formula: 'Goals ÷ (Goals + Assists) × 100'
    },
    'Playmaker Ratio': {
        icon: '🧠',
        description: 'Percentage of offensive actions that are assists. High = playmaker.',
        formula: 'Assists ÷ (Goals + Assists) × 100'
    },
    'Goals / Assists Ratio': {
        icon: '⚖️',
        description: 'Goals per 1 assist. High = selfish finisher, low = playmaker.',
        formula: 'Goals ÷ Assists'
    },
    'Assists / Goals Ratio': {
        icon: '🔄',
        description: 'Assists per 1 goal. High = playmaker who creates more than scores.',
        formula: 'Assists ÷ Goals'
    },
    'Defensive Ratio': {
        icon: '🛡️',
        description: 'Percentage of actions that are saves. High = defensive specialist.',
        formula: 'Saves ÷ Total Actions × 100'
    },
    'Offensive Ratio': {
        icon: '⚔️',
        description: 'Percentage of actions that are offensive. High = attacking player.',
        formula: 'Total Contributions ÷ Total Actions × 100'
    },
    'Libero Index': {
        icon: '🧱',
        description: 'Defensive load vs offensive output. >1 = defender who sweeps.',
        formula: 'Saves ÷ Total Contributions'
    },
    'Forward Index': {
        icon: '🚀',
        description: 'Offensive load vs defensive output. >1 = attacker who pushes forward.',
        formula: 'Total Contributions ÷ Saves'
    },
    'Saves / Goals Ratio': {
        icon: '🥅',
        description: 'Saves needed per 1 goal scored. Shows defensive vs offensive balance.',
        formula: 'Saves ÷ Goals'
    },
    'Saves / Assists Ratio': {
        icon: '🧤',
        description: 'Saves per 1 assist. Goalkeeper playmaking vision.',
        formula: 'Saves ÷ Assists'
    },
    'Goals / Win': {
        icon: '⚡',
        description: 'Goals scored per win. How much offensive burden is carried.',
        formula: 'Total Goals ÷ Wins'
    },
    'Assists / Win': {
        icon: '🤝',
        description: 'Assists per win. Playmaking contribution to victories.',
        formula: 'Total Assists ÷ Wins'
    },
    'Saves / Win': {
        icon: '💪',
        description: 'Saves per win. Defensive effort needed to secure victory.',
        formula: 'Total Saves ÷ Wins'
    },
    'Actions / Win': {
        icon: '🔥',
        description: 'Total actions per win. Effort coefficient for each victory.',
        formula: 'Total Actions ÷ Wins'
    },
    'Goals / Loss': {
        icon: '📉',
        description: 'Goals scored even in losses. Never stops trying.',
        formula: 'Total Goals ÷ Losses'

// TREND TESPİT SİSTEMİ (YENİ)
// ============================================================
function getPlayerTrend(current, previous) {
    // Yeni oyuncu
    if (!previous) return { trend: 'new', icon: '🆕', label: 'New Player', color: '#38bdf8' };
    
    let improvements = 0;
    let declines = 0;
    
    const metrics = [
        { key: 'Win_Rate', higher: true },
        { key: 'Goals_PG', higher: true },
        { key: 'Assists_PG', higher: true },
        { key: 'Saves_PG', higher: true },
        { key: 'MVP_Win_Rate', higher: true },
        { key: 'Win_Loss_Ratio', higher: true }
    ];
    
    metrics.forEach(m => {
        const currentVal = parseFloat(String(current[m.key] || '0').replace(/,/g, ''));
        const prevVal = parseFloat(String(previous[m.key] || '0').replace(/,/g, ''));
        
        if (!isNaN(currentVal) && !isNaN(prevVal) && currentVal !== prevVal) {
            // Değişim %1'den fazla ise say
            const changePercent = Math.abs((currentVal - prevVal) / (prevVal || 1) * 100);
            if (changePercent > 1) {
                if (currentVal > prevVal) {
                    improvements++;
                } else {
                    declines++;
                }
            }
        }
    });
    
    // En az 2 metrikte belirgin iyileşme/düşüş
    if (improvements >= 2 && improvements > declines) {
        return { trend: 'up', icon: '📈', label: 'Performance Improving', color: '#10b981' };
    } else if (declines >= 2 && declines > improvements) {
        return { trend: 'down', icon: '📉', label: 'Performance Declining', color: '#f87171' };
    } else {
        return { trend: 'stable', icon: '➡️', label: 'Performance Stable', color: '#fbbf24' };
    }
}

let dataTable; let globalPlayers = [];

function escapeHtml(text) {
    if (!text) return '?';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
}

function parseQuotedCSV(line) {
    const result = []; let current = ''; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') { inQuotes = !inQuotes; } else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; } else { current += char; }
    }
    result.push(current.trim()); return result;
}

function getFlagHtml(countryCode) {
    if (!countryCode) return '';
    if (typeof countryCode === 'string' && countryCode.length === 2 && /^[A-Za-z]{2}$/.test(countryCode)) {
        return `<img src="flags/${countryCode.toLowerCase()}.svg" alt="${countryCode}" width="20" height="14" style="border-radius: 2px; display: block;" loading="lazy">`;
    }
    if (countryCode.length >= 2) {
        try {
            const first = countryCode.codePointAt(0); const second = countryCode.codePointAt(2);
            if (first >= 0x1F1E6 && first <= 0x1F1FF && second >= 0x1F1E6 && second <= 0x1F1FF) {
                const country1 = String.fromCharCode(first - 0x1F1E6 + 65); const country2 = String.fromCharCode(second - 0x1F1E6 + 65);
                return `<img src="flags/${(country1 + country2).toLowerCase()}.svg" alt="${country1+country2}" width="20" height="14" style="border-radius: 2px; display: block;" loading="lazy">`;
            }
        } catch (e) { }
    }
    return '';
}

function getChangeClass(current, previous) {
    if (!previous) return '';
    const diff = parseFloat(String(current).replace(/,/g, '')) - parseFloat(String(previous).replace(/,/g, ''));
    if (Math.abs(diff) < 0.0001 || isNaN(diff)) return '';
    return diff > 0 ? 'change-text-up' : 'change-text-down';
}

function getChangeTag(current, previous, isNew) {
    if (isNew) return `<span class="change-tag new">NEW</span>`;
    if (!previous) return '';
    const diff = parseFloat(String(current).replace(/,/g, '')) - parseFloat(String(previous).replace(/,/g, ''));
    if (Math.abs(diff) < 0.0001 || isNaN(diff)) return '';
    return `<span class="change-tag ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(1)}</span>`;
}

function getTop3Roles(allRolesStr) {
    if (!allRolesStr) return [
        {emoji: '🔄', name: 'Unknown'},
        {emoji: '🔄', name: 'Unknown'},
        {emoji: '🔄', name: 'Unknown'}
    ];
    
    const roles = allRolesStr.split(' | ');
    const top3 = roles.slice(0, 3);
    
    const result = top3.map(r => {
        const emojiMatch = r.match(/^([^\s]+)/);
        const emoji = emojiMatch ? emojiMatch[1] : '🔄';
        let name = r.replace(/^[^\s]+\s/, '');
        name = name.replace(/\([^)]*\)/, '').trim();
        name = name.replace(/ - .*$/, '').trim();
        return { emoji: emoji, name: name || 'Unknown' };
    });
    
    while (result.length < 3) {
        result.push({emoji: '🔄', name: 'Unknown'});
    }
    return result;
}

function isPlayerChanged(current, previous) {
    if (!previous) return true;
    const fields = ['Matches', 'Wins', 'Losses', 'Win_Rate', 'Total_Goals', 'Total_Assists', 'Total_Saves', 'Total_OwnGoals', 'MVP_Count'];
    for (let f of fields) {
        const c = parseFloat(String(current[f] || '').replace(/,/g, '')); const p = parseFloat(String(previous[f] || '').replace(/,/g, ''));
        if (!isNaN(c) && !isNaN(p) && Math.abs(c - p) > 0.0001) return true;
    }
    return false;
}

function findPreviousPlayer(nick, userId) {
    if (!nick && !userId) return null;
    if (userId) {
        for (let key in previousData) {
            if (previousData[key]['UserID'] === userId) {
                return previousData[key];
            }
        }
    }
    if (nick) {
        const lowerNick = nick.toLowerCase();
        for (let key in previousData) {
            if (key.toLowerCase() === lowerNick) {
                return previousData[key];
            }
        }
    }
    return null;
}

async function loadPreviousData() {
    try {
        const isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' ||
                        window.location.hostname === '';
        
        const url = isLocal 
            ? '../data/players_previous.csv?t=' + new Date().getTime()
            : 'https://raw.githubusercontent.com/pykellog/carball-rating-system/refs/heads/main/data/players_previous.csv?t=' + new Date().getTime();
        
        const res = await fetch(url);
        if (res.ok) {
            const lines = (await res.text()).split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 3) return;
            if (lines.length > 0) {
                previousUpdateDate = lines[0].replace(/^"|"$/g, '').replace(/:(\d{2}) UTC$/, ' UTC');
                document.getElementById('footerUpdate').textContent = `Previous Update: ${previousUpdateDate}`;
            }
            const headers = parseQuotedCSV(lines[2]).map(h => h.replace(/^"|"$/g, ''));
            for (let i = 3; i < lines.length; i++) {
                const vals = parseQuotedCSV(lines[i]);
                if (vals.length < 4) continue;
                const p = {}; headers.forEach((h, idx) => p[h] = vals[idx] ? vals[idx].replace(/^"|"$/g, '') : '');
                if (p['Nick']) previousData[p['Nick']] = p;
            }
        }
    } catch (e) {}
}

function formatChildRow(p, prev) {

    const actionsPerMatch = parseFloat(p['Actions_PG'] || 0);
    const mvpWinRate = parseFloat(p['MVP_Win_Rate'] || 0) / 100;
    const opqi = winRate * actionsPerMatch * mvpWinRate;
    
    const totalContribs = totalGoals + totalAssists;
    const totalActions = totalGoals + totalAssists + totalSaves;
    const goalsAssistsRatio = totalAssists > 0 ? (totalGoals / totalAssists) : totalGoals;
    const assistsGoalsRatio = totalGoals > 0 ? (totalAssists / totalGoals) : totalAssists;
    const roleBalance = parseFloat(p['Defensive_Ratio'] || 1) > 0 ? 
        (parseFloat(p['Offensive_Ratio'] || 0) / parseFloat(p['Defensive_Ratio'] || 1)) : 0;
    
    const lossRate = losses / matches * 100;
    const lossWinRatio = wins > 0 ? (losses / wins) : 0;
    const assistsPerWin = wins > 0 ? (totalAssists / wins) : 0;
    const assistsPerLoss = losses > 0 ? (totalAssists / losses) : 0;
    const nonMvpWinRate = wins > 0 ? ((wins - mvp) / wins * 100) : 0;
    const mvpToGoalRatio = totalGoals > 0 ? (mvp / totalGoals) : 0;
    
    const r = (emoji, label, valKey, suffix = '', computed = null, isInteger = false, isPercent = false) => {
        let val;
        if (computed !== null) {
            if (isPercent) {
                val = computed.toFixed(2) + '%';
            } else if (isInteger) {
                val = Math.round(computed).toString();
            } else {
                val = computed.toFixed(2);
            }
        } else {
            val = escapeHtml(p[valKey] || '0');
            if (isPercent && val !== '0') val += '%';
        }
        if (suffix && !isPercent) val += suffix;
        let cls = getChangeClass(p[valKey], prev?.[valKey]);
        return `<div class="stat-row"><span class="stat-label">${emoji} ${label}</span><span class="stat-val ${cls}">${val}</span></div>`;

    return `

                ${r('🏆', 'Win Rate', 'Win_Rate', '', null, false, true)}
                ${r('📉', 'Loss Rate', '', '', lossRate, false, true)}
                ${r('⚖️', 'Win / Loss Ratio', 'Win_Loss_Ratio')}
                ${r('📊', 'Loss / Win Ratio', '', '', lossWinRatio)}
                ${r('🏅', 'MVP Count', 'MVP_Count')}
                ${r('👑', 'MVP / Total Rate', 'MVP_Rate', '', null, false, true)}
                ${r('🎯', 'MVP / Win Rate', 'MVP_Win_Rate', '', null, false, true)}
            </div>

            <div class="stat-card card-scoring" style="border-color:#f87171;">
                <div class="card-header" style="color:#f87171;">⚽ Scoring & Finishing</div>
                ${r('⚽', 'Goals / Match', 'Goals_PG')}
                ${r('🗡️', 'Striker Ratio', 'Striker_Ratio', '', null, false, true)}
                ${r('⚡', 'Goals / Win', 'Goals_Per_Win')}
                ${r('📉', 'Goals / Loss', 'Goals_Per_Loss')}
                ${r('⚖️', 'Goals / Assists Ratio', '', '', goalsAssistsRatio)}
                ${r('🚀', 'Forward Index', 'Forward_Index')}
                ${r('🎯', 'MVP to Goal Ratio', '', '', mvpToGoalRatio)}
            </div>

            <div class="stat-card card-playmaking" style="border-color:#fbbf24;">
                <div class="card-header" style="color:#fbbf24;">🤝 Playmaking & Teamwork</div>
                ${r('🤝', 'Assists / Match', 'Assists_PG')}
                ${r('🧠', 'Playmaker Ratio', 'Playmaker_Ratio', '', null, false, true)}
                ${r('🤝', 'Assists / Win', '', '', assistsPerWin)}
                ${r('📊', 'Assists / Loss', '', '', assistsPerLoss)}
                ${r('🔄', 'Assists / Goals Ratio', '', '', assistsGoalsRatio)}
                ${r('⚔️', 'Offensive Ratio', 'Offensive_Ratio', '', null, false, true)}
                ${r('🤝', 'Non-MVP Win Rate', '', '', nonMvpWinRate, false, true)}
            </div>

            <div class="stat-card card-defense" style="border-color:#38bdf8;">
                <div class="card-header" style="color:#38bdf8;">🛡️ Defense & Goalkeeping</div>
                ${r('🧤', 'Saves / Match', 'Saves_PG')}
                ${r('🛡️', 'Defensive Ratio', 'Defensive_Ratio', '', null, false, true)}
                ${r('🧱', 'Libero Index', 'Libero_Index')}
                ${r('🥅', 'Saves / Goals Ratio', 'Saves_To_Goals_Ratio')}
                ${r('🧤', 'Saves / Assists Ratio', 'Saves_To_Assists_Ratio')}

    dataTable.on('draw', function () { 
        updateCustomPagination();
        document.getElementById('tableScrollContainer').scrollTop = 0;
    });
}

function updateCustomPagination() {
    let info = dataTable.page.info();
    let container = document.getElementById('customPagination');
    container.innerHTML = `
        <div style="font-size: 0.85rem; color: var(--text-muted);">
            Showing ${info.start + 1} to ${info.end} of ${info.recordsDisplay} players
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="goToPage('previous')" ${info.page === 0 ? 'disabled' : ''} style="background:rgba(24,24,27,0.8); color:white; border:1px solid var(--border-color); padding:4px 12px; border-radius:4px; cursor:${info.page === 0 ? 'not-allowed' : 'pointer'}; opacity:${info.page === 0 ? '0.5' : '1'};">Prev</button>
            <button onclick="goToPage('next')" ${info.page === info.pages - 1 ? 'disabled' : ''} style="background:rgba(24,24,27,0.8); color:white; border:1px solid var(--border-color); padding:4px 12px; border-radius:4px; cursor:${info.page === info.pages - 1 ? 'not-allowed' : 'pointer'}; opacity:${info.page === info.pages - 1 ? '0.5' : '1'};">Next</button>
        </div>
    `;
}

function goToPage(direction) {
    dataTable.page(direction).draw('page');
    document.getElementById('tableScrollContainer').scrollTop = 0;
}

async function loadData() {
    try {
        await loadPreviousData();
        const isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' ||
                        window.location.hostname === '';
        
        const url = isLocal 
            ? '../data/players.csv?t=' + new Date().getTime()
            : 'https://raw.githubusercontent.com/pykellog/carball-rating-system/refs/heads/main/data/players.csv?t=' + new Date().getTime();
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const lines = (await res.text()).split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length < 3) throw new Error('CSV is empty.');
        
        const updateDate = lines[0].replace(/^"|"$/g, '').replace(/:(\d{2}) UTC$/, ' UTC');
        const playerCount = parseInt(lines[1].replace(/^"|"$/g, '').replace('PlayerCount: ', ''));
        const headers = parseQuotedCSV(lines[2]).map(h => h.replace(/^"|"$/g, ''));
        
        globalPlayers = []; changedPlayers.clear();
        for (let i = 3; i < lines.length; i++) {
            const vals = parseQuotedCSV(lines[i]);
            if (vals.length < 4) continue;
            const p = {}; headers.forEach((h, idx) => p[h] = vals[idx] ? vals[idx].replace(/^"|"$/g, '') : '');
            globalPlayers.push(p);
        }
        
        globalPlayers.forEach((p) => { 
            if (isPlayerChanged(p, findPreviousPlayer(p['Nick'], p['UserID']))) {
                changedPlayers.add(p['Nick']);
            }
        });
        
        document.getElementById('lastUpdate').textContent = updateDate;
        document.getElementById('playerCount').textContent = playerCount;
        document.getElementById('changedCount').textContent = changedPlayers.size;
        
        if (document.getElementById('footerUpdate').textContent === 'Previous Update: -' && previousUpdateDate !== '-') {
            document.getElementById('footerUpdate').textContent = `Previous Update: ${previousUpdateDate}`;
        }
        
        rebuildTable(false);
    } catch (err) { 
        document.getElementById('tableBody').innerHTML = `<tr><td colspan="15" style="padding: 3rem; color: #f87171; text-align: center;">⚠️ Error loading data.<br><small>${err.message}</small></td></tr>`; 
    }
}
$(document).ready(function() { loadData(); });

document.addEventListener("DOMContentLoaded", function () {
    const searchBox = document.getElementById("customSearch");
    let searchTimer;
    if (searchBox) {
        searchBox.addEventListener("input", function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function () {
                const searchTerm = searchBox.value.trim().toLowerCase();
                if (searchTerm.length >= 2 && window.umami) {
                    umami.track("Canlı Arama", { kelime: searchTerm });
                }
            }, 1500);
        });
    }
});
