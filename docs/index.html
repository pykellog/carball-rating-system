<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFS Gaming CarBall Player Rankings</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    
    <style>
        :root {
            --bg-base: #09090b; 
            --bg-card: rgba(18, 18, 20, 0.88);
            --bg-hover: rgba(28, 28, 32, 0.9);
            --accent-green: #10b981; 
            --accent-glow: rgba(16, 185, 129, 0.15);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
            
            --tier-s: #fbbf24; --tier-a: #c084fc; --tier-b: #38bdf8;
            --tier-c: #4ade80; --tier-d: #f87171; --tier-e: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* === BACKGROUND & PERFORMANCE LAYOUT === */
        html, body {
            width: 100%; height: 100%; margin: 0; padding: 0;
            overflow: hidden; 
            background-color: var(--bg-base);
            font-family: 'Inter', sans-serif; color: var(--text-main); -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            background-image: 
                radial-gradient(circle at center, rgba(9, 9, 11, 0.2) 0%, rgba(9, 9, 11, 0.6) 100%),
                linear-gradient(to bottom, rgba(9, 9, 11, 0.2), rgba(9, 9, 11, 0.4)),
                radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 70%),
                url('stadium-bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transform: translateZ(0);
            pointer-events: none;
        }

        .app-container { 
            position: relative; z-index: 1;
            display: flex; flex-direction: column; height: 100vh; max-width: 1400px; margin: 0 auto; padding: 1.25rem; 
        }

        /* HEADER */
        .hero { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; }
        .hero h1 { 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 2.3rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.05em; 
            background: linear-gradient(120deg, #e7a922 0%, #ffffff 50%, #4d4d4d 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 2px 10px rgba(251, 191, 36, 0.2));
            margin: 0; 
        }
        .hero-stats { display: flex; gap: 1rem; background: var(--bg-card); padding: 0.4rem 1rem; border-radius: 100px; border: 1px solid var(--border-color); font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
        .hero-stats strong { color: var(--text-main); }

        /* CONTROLS */
        .controls-wrapper { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; background: var(--bg-card); padding: 0.6rem 1rem; border-radius: 10px; border: 1px solid var(--border-color); }
        .search-box { position: relative; flex-grow: 1; max-width: 320px; }
        .search-box input { width: 100%; padding: 0.45rem 1rem 0.45rem 2.2rem; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-color); border-radius: 6px; color: white; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
        .search-box input:focus { outline: none; border-color: var(--accent-green); }
        .search-box::before { content: "🔍"; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 0.8rem; }
        
        .filter-btn { background: rgba(16, 185, 129, 0.1); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.2); padding: 0.45rem 0.9rem; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: background 0.15s ease; display: flex; align-items: center; gap: 0.2rem; line-height: 1; text-decoration: none !important; }
        .filter-btn:hover { background: rgba(16, 185, 129, 0.2); }
        .filter-btn.active { background: var(--accent-green); color: #000; }
        .filter-btn .count { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 10px; line-height: 1; font-size: 0.75rem; }

        /* TABLE AREA */
        .table-wrapper { flex-grow: 1; min-height: 0; background: var(--bg-card); border-radius: 10px; border: 1px solid var(--border-color); display: flex; flex-direction: column; overflow: hidden; transform: translateZ(0); }
        .table-scroll-container { flex-grow: 1; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .table-scroll-container::-webkit-scrollbar { display: none; }

        table.dataTable { width: 100% !important; margin: 0 !important; border-collapse: collapse !important; font-family: 'Inter', sans-serif; }
        table.dataTable thead { position: sticky; top: 0; z-index: 10; background: #0c0c0e; }
        table.dataTable thead th { color: var(--text-muted) !important; font-family: 'Rajdhani', sans-serif; font-size: 0.9rem !important; font-weight: 700; text-transform: uppercase; padding: 0.75rem 0.3rem !important; border-bottom: 1px solid var(--border-color) !important; white-space: nowrap; cursor: help; }
        table.dataTable tbody tr { border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; background: transparent !important; transition: background 0.15s ease; }
        table.dataTable tbody tr:hover { background-color: var(--bg-hover) !important; }
        table.dataTable tbody tr.changed-player { 
            /* border-left: 3px solid #fbbf24 !important; */
            background-color: rgba(251, 191, 36, 0.05) !important;
        }
        table.dataTable td { padding: 0.55rem 0.3rem !important; vertical-align: middle; border: none !important; font-size: 0.95rem; font-weight: 500; white-space: nowrap; }

        /* COLUMN SIZES & STYLES */
        .col-rank { font-family: 'Rajdhani', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--text-muted); text-align: center !important; width: 30px; }
        .col-player { display: flex; align-items: center; gap: 6px; }
        .player-info { display: flex; flex-direction: column; line-height: 1.1; }
        .player-nick { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 4px; }
        .player-user { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
        .player-user a { color: var(--text-muted); text-decoration: none; transition: color 0.15s ease; }
        .player-user a:hover { color: var(--accent-green); }

        .col-rating { 
            font-family: 'Rajdhani', sans-serif; 
            font-size: 1.15rem !important; 
            font-weight: 700 !important; 
            color: #10b981 !important; 
            text-align: center; 
            width: 85px;
            letter-spacing: 0.03em;
        }        
        .col-skill { font-family: 'Rajdhani', sans-serif; font-size: 1.15rem; font-weight: 700; color: #f4f4f5; text-align: center; width: 60px; }
        .col-tier { text-align: center; width: 55px; }
        .col-role { text-align: center; font-size: 1.2rem; width: 35px; }
        .col-stat { text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1.05rem; }
        .col-win { text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1.05rem; }
        .col-loss { text-align: center; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1.05rem; }
        
        .badge { display: inline-flex; justify-content: center; align-items: center; padding: 2px 5px; border-radius: 4px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; }
        .badge-S { background: rgba(251, 191, 36, 0.15); color: var(--tier-s); border: 1px solid rgba(251, 191, 36, 0.3); }
        .badge-A { background: rgba(192, 132, 252, 0.15); color: var(--tier-a); border: 1px solid rgba(192, 132, 252, 0.3); }
        .badge-B { background: rgba(56, 189, 248, 0.15); color: var(--tier-b); border: 1px solid rgba(56, 189, 248, 0.3); }
        .badge-C { background: rgba(74, 222, 128, 0.15); color: var(--tier-c); border: 1px solid rgba(74, 222, 128, 0.3); }
        .badge-D { background: rgba(248, 113, 113, 0.15); color: var(--tier-d); border: 1px solid rgba(248, 113, 113, 0.3); }
        .badge-E { background: rgba(148, 163, 184, 0.15); color: var(--tier-e); border: 1px solid rgba(148, 163, 184, 0.3); }

        .change-tag { display: inline-flex; align-items: center; padding: 1px 3px; border-radius: 3px; font-size: 0.65rem; font-weight: 700; }
        .change-tag.up { background: rgba(16, 185, 129, 0.15); color: var(--accent-green); }
        .change-tag.down { background: rgba(248, 113, 113, 0.15); color: #f87171; }
        .change-tag.new { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .change-text-up { color: var(--accent-green) !important; }
        .change-text-down { color: #f87171 !important; }

        /* === DETAILS PANEL === */
        table.dataTable tbody tr.expanded-row-bg { background-color: rgba(0,0,0,0.75) !important; }
        .details-wrapper { padding: 1rem 1.25rem; background: rgba(5, 5, 6, 0.6); }
        .details-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        
        .stat-card { background: #121215; border-radius: 8px; border: 1px solid var(--border-color); border-top: 3px solid; padding: 0.85rem; position: relative; overflow: hidden; }
        
        .card-core { border-top-color: #fbbf24; }
        .card-offense { border-top-color: #f87171; }
        .card-defense { border-top-color: #38bdf8; }
        .card-support { border-top-color: #c084fc; }

        .card-header { font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700; color: white; display: flex; align-items: center; gap: 8px; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.4rem; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px dashed rgba(255,255,255,0.03); }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        .stat-val { font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 1.05rem; }

        /* BOTTOM PAGINATION */
        .table-footer { flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem; background: #0c0c0e; border-top: 1px solid var(--border-color); }
        .dataTables_wrapper .dataTables_filter, .dataTables_wrapper .dataTables_length, .dataTables_info, .dataTables_paginate { display: none !important; }
        
        /* FOOTER */
        .app-footer { flex-shrink: 0; text-align: center; margin-top: 0.75rem; color: rgba(255,255,255,0.6); font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center;}
        .app-footer a { color: var(--accent-green); text-decoration: none; font-weight: 500; }
        .app-footer a:hover { text-decoration: underline; }
        
        .expand-icon { font-size: 11px; color: var(--text-muted); transition: transform 0.15s ease; display: inline-block; }
        tr.shown .expand-icon { transform: rotate(90deg); color: var(--accent-green); }
    </style>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="adefbdcd-a363-4714-8f6d-86f7cd379c8c"></script>
</head>
<body>

<div class="app-container">
    
    <!-- Hero / Header -->
    <div class="hero">
        <h1>CarBall Rankings</h1>
        <div class="hero-stats">
            <div><span style="color: #ebebeb;" id="playerCount">0</span> Players on Field</div>
            <div>Last Update: <span style="color: #ebebeb;" id="lastUpdate">-</span></div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls-wrapper">
        <div class="search-box">
            <input type="text" id="customSearch" placeholder="Search a player (e.g. fycnamed)...">
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="filter-btn" id="filterChangedBtn" onclick="toggleFilter()">
                📊 Changes <span class="count" id="changedCount">0</span>
            </button>
            <a href="https://github.com/pykellog/carball-rating-system" target="_blank" class="filter-btn" style="background: transparent; color: white; border-color: rgba(255,255,255,0.2);">
                GitHub
            </a>
        </div>
    </div>

    <!-- MAIN TABLE AREA -->
    <div class="table-wrapper">
        <div class="table-scroll-container" id="tableScrollContainer">
            <table id="playersTable" class="display">
                <thead>
                    <tr>
                        <th class="col-rank" title="Leaderboard Position">#</th>
                        <th title="Player nickname and forum profile">Player</th>
                        <th style="text-align: center; cursor: pointer;" title="Primary playstyle role (Click to group roles)">Role</th>
                        <th style="text-align: center; color: var(--accent-green);" title="Overall Performance Rating (Main score with performance multiplier applied)">Rating</th>
                        <th style="text-align: center;" title="Raw Skill Rating (Pure statistical score independent of match count)">Skill</th>
                        <th style="text-align: center;" title="Player skill tier group (S, A, B, C, D, E)">Tier</th>
                        <th style="text-align: center;" title="Total matches played">Matches</th>
                        <th style="text-align: center;" title="Total matches won">Wins</th>
                        <th style="text-align: center;" title="Total matches lost">Losses</th>
                        <th style="text-align: center;" title="Total goals scored">Goals</th>
                        <th style="text-align: center;" title="Total assists provided">Assists</th>
                        <th style="text-align: center;" title="Total saves made">Saves</th>
                        <th style="text-align: center;" title="Total Most Valuable Player awards won">MVP</th>
                        <th style="text-align: center;" title="Offensive contribution share (Goal-oriented play style percentage)">OFF %</th>
                        <th style="text-align: center;" title="Defensive contribution share (Save-oriented play style percentage)">DEF %</th>
                        <th style="text-align: center;" title="Playmaking contribution share (Assist-oriented play style percentage)">PLAY %</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <!-- Custom Pagination -->
        <div class="table-footer" id="customPagination"></div>
    </div>
    
    <!-- Global Footer -->
    <div class="app-footer" style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px;">
        <div>Data sourced from <strong>FFS Gaming</strong> MTA server.</div>
        <div id="footerUpdate">Previous Update: -</div>
        <div style="font-size: 0.7rem; color: rgba(255,255,255,0.4);">
            Designed & Built by 
            <span style="background: linear-gradient(120deg, #465828, #e5f9cf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 600;">"keLLog</span>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<script>
let dataTable; let globalPlayers = [];
let previousData = {}; let changedPlayers = new Set(); let filterActive = false;
let searchTimeout = null;
let previousUpdateDate = '-';

function escapeHtml(text) {
    if (!text) return '?';
    const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
}

function parseQuotedCSV(line) {
    const result = []; let current = ''; let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') { inQuotes = !inQuotes; } else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; } else { current += char; }
    }
    result.push(current.trim()); return result;
}

function getFlagHtml(countryCode) {
    if (!countryCode) return '';
    if (typeof countryCode === 'string' && countryCode.length === 2 && /^[A-Za-z]{2}$/.test(countryCode)) {
        return `<img src="flags/${countryCode.toLowerCase()}.svg" alt="${countryCode}" width="20" height="14" style="border-radius: 2px; display: block;" loading="lazy">`;
    }
    if (countryCode.length >= 2) {
        try {
            const first = countryCode.codePointAt(0); const second = countryCode.codePointAt(2);
            if (first >= 0x1F1E6 && first <= 0x1F1FF && second >= 0x1F1E6 && second <= 0x1F1FF) {
                const country1 = String.fromCharCode(first - 0x1F1E6 + 65); const country2 = String.fromCharCode(second - 0x1F1E6 + 65);
                return `<img src="flags/${(country1 + country2).toLowerCase()}.svg" alt="${country1+country2}" width="20" height="14" style="border-radius: 2px; display: block;" loading="lazy">`;
            }
        } catch (e) { }
    }
    return '';
}

function getChangeClass(current, previous) {
    if (!previous) return '';
    const diff = parseFloat(String(current).replace(/,/g, '')) - parseFloat(String(previous).replace(/,/g, ''));
    if (Math.abs(diff) < 0.0001 || isNaN(diff)) return '';
    return diff > 0 ? 'change-text-up' : 'change-text-down';
}

function getChangeTag(current, previous, isNew) {
    if (isNew) return `<span class="change-tag new">NEW</span>`;
    if (!previous) return '';
    const diff = parseFloat(String(current).replace(/,/g, '')) - parseFloat(String(previous).replace(/,/g, ''));
    if (Math.abs(diff) < 0.0001 || isNaN(diff)) return '';
    return `<span class="change-tag ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff).toFixed(1)}</span>`;
}

function isPlayerChanged(current, previous) {
    if (!previous) return true;
    const fields = ['Rating', 'Raw_Skill', 'Multiplier', 'Matches', 'Wins', 'Losses', 'Win_Rate', 'Win_Loss_Ratio', 'Goals_PG', 'Assists_PG', 'Saves_PG', 'OwnGoals_PG', 'Total_Goals', 'Total_Assists', 'Total_Saves', 'Total_OwnGoals', 'MVP_Count', 'MVP_Per_Win', 'Offensive_Ratio', 'Defensive_Ratio', 'Playmaker_Ratio', 'Efficiency', 'Impact', 'Goalkeeping_Index', 'Defense_Reliability', 'Total_Actions'];
    for (let f of fields) {
        const c = parseFloat(String(current[f] || '').replace(/,/g, '')); const p = parseFloat(String(previous[f] || '').replace(/,/g, ''));
        if (!isNaN(c) && !isNaN(p) && Math.abs(c - p) > 0.0001) return true;
        if (isNaN(c) && isNaN(p) && current[f] !== previous[f]) return true;
    }
    return false;
}

function findPreviousPlayer(nick, userId) {
    if (!nick && !userId) return null;
    
    // 1. UserID ile eşleşme (EN GÜVENİLİR)
    if (userId) {
        for (let key in previousData) {
            if (previousData[key]['UserID'] === userId) {
                return previousData[key];
            }
        }
    }
    
    // 2. Direkt nick eşleşme
    if (nick && previousData[nick]) {
        return previousData[nick];
    }
    
    // 3. Case-insensitive nick eşleşme
    if (nick) {
        const lowerNick = nick.toLowerCase();
        for (let key in previousData) {
            if (key.toLowerCase() === lowerNick) {
                return previousData[key];
            }
        }
    }
    
    // 4. Parantez içindeki (XXXK) kısmını yok say
    if (nick) {
        const baseNick = nick.replace(/ \(\d+K\)/, '').toLowerCase();
        for (let key in previousData) {
            const keyBase = key.replace(/ \(\d+K\)/, '').toLowerCase();
            if (keyBase === baseNick) {
                return previousData[key];
            }
        }
    }
    
    return null;
}

async function loadPreviousData() {
    try {
        const isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' ||
                        window.location.hostname === '';
        
        const url = isLocal 
            ? '../data/players_previous.csv?t=' + new Date().getTime()
            : 'https://raw.githubusercontent.com/pykellog/carball-rating-system/refs/heads/main/data/players_previous.csv?t=' + new Date().getTime();
        
        console.log('Loading previous from:', url);
        const res = await fetch(url);
        if (res.ok) {
            const lines = (await res.text()).split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 3) return;
            
            if (lines.length > 0) {
                previousUpdateDate = lines[0].replace(/^"|"$/g, '').replace(/:(\d{2}) UTC$/, ' UTC');
                document.getElementById('footerUpdate').textContent = `Previous Update: ${previousUpdateDate}`;
            }
            
            const headers = parseQuotedCSV(lines[2]).map(h => h.replace(/^"|"$/g, ''));
            for (let i = 3; i < lines.length; i++) {
                const vals = parseQuotedCSV(lines[i]);
                if (vals.length < 4) continue;
                const p = {}; headers.forEach((h, idx) => p[h] = vals[idx] ? vals[idx].replace(/^"|"$/g, '') : '');
                if (p['Nick']) previousData[p['Nick']] = p;
            }
        }
    } catch (e) {}
}

function getRoleEmoji(role) {
    if (!role) return '🔄'; if (role.includes('Goalkeeper')) return '🧤'; if (role.includes('Striker')) return '⚽';
    if (role.includes('Playmaker') || role.includes('MVP') || role.includes('Midfielder')) return '🎯'; return '🔄';
}

function toggleFilter() {
    filterActive = !filterActive;
    const btn = document.getElementById('filterChangedBtn');
    if (filterActive) { btn.classList.add('active'); btn.innerHTML = `📊 Changes <span class="count">${changedPlayers.size}</span> ✕`; } 
    else { btn.classList.remove('active'); btn.innerHTML = `📊 Changes <span class="count">${changedPlayers.size}</span>`; }
    rebuildTable(filterActive);
}

function formatChildRow(p, prev) {
    const r = (emoji, label, valKey, isPercent = false) => {
        let val = escapeHtml(p[valKey] || '0'); if(isPercent && val !== '0') val += '%';
        let cls = getChangeClass(p[valKey], prev?.[valKey]);
        return `<div class="stat-row"><span class="stat-label">${emoji} ${label}</span><span class="stat-val ${cls}">${val}</span></div>`;
    };
    return `
    <div class="details-wrapper">
        <div class="details-grid">
            
            <div class="stat-card card-core">
                <div class="card-header">👑 MVP & Core</div>
                ${r('🏆', 'Win Rate', 'Win_Rate', true)}
                ${r('🏅', 'MVP Count', 'MVP_Count')}
                ${r('⚡', 'Impact', 'Impact')}
                ${r('⚙️', 'Efficiency', 'Efficiency')}
            </div>

            <div class="stat-card card-offense">
                <div class="card-header" style="color:#f87171;">🔥 Offense</div>
                ${r('⚽', 'Goals / Game', 'Goals_PG')}
                ${r('🥅', 'Total Goals', 'Total_Goals')}
                ${r('🗡️', 'Offensive Ratio', 'Offensive_Ratio', true)}
                ${r('🎬', 'Total Actions', 'Total_Actions')}
            </div>

            <div class="stat-card card-defense">
                <div class="card-header" style="color:#38bdf8;">🛡️ Defense</div>
                ${r('🧤', 'Saves / Game', 'Saves_PG')}
                ${r('🧱', 'Total Saves', 'Total_Saves')}
                ${r('🛡️', 'Def. Reliability', 'Defense_Reliability')}
                ${r('🏰', 'GK Index', 'Goalkeeping_Index', true)}
            </div>

            <div class="stat-card card-support">
                <div class="card-header" style="color:#c084fc;">🤝 Support</div>
                ${r('🤝', 'Assists / Game', 'Assists_PG')}
                ${r('➕', 'Total Assists', 'Total_Assists')}
                ${r('🧠', 'Playmaker Ratio', 'Playmaker_Ratio', true)}
                ${r('⚠️', 'Own Goals', 'Total_OwnGoals')}
            </div>

        </div>
    </div>`;
}

function rebuildTable(onlyChanged) {
    if (dataTable) { $('#playersTable tbody').off('click', 'tr.master-row'); dataTable.destroy(); }
    const tbody = document.getElementById('tableBody'); tbody.innerHTML = '';
    let filteredPlayers = onlyChanged ? globalPlayers.filter(p => changedPlayers.has(p['Nick'])) : globalPlayers;
    
    const fragment = document.createDocumentFragment();

    filteredPlayers.forEach((player) => {
        const realRank = globalPlayers.indexOf(player) + 1;
        const tier = player['Tier'] || 'E-Tier'; 
        let tierClass = tier.includes('S') ? 'S' : tier.includes('A') ? 'A' : tier.includes('B') ? 'B' : tier.includes('C') ? 'C' : tier.includes('D') ? 'D' : 'E';
        let prev = findPreviousPlayer(player['Nick'], player['UserID']);
        const isChanged = changedPlayers.has(player['Nick']);
        
        // Tüm sütunlar için change class'larını hesapla
        const ratingClass = getChangeClass(player['Rating'], prev?.['Rating']);
        const skillClass = getChangeClass(player['Raw_Skill'], prev?.['Raw_Skill']);
        const matchesClass = getChangeClass(player['Matches'], prev?.['Matches']);
        const winsClass = getChangeClass(player['Wins'], prev?.['Wins']);
        const lossesClass = getChangeClass(player['Losses'], prev?.['Losses']);
        const goalsClass = getChangeClass(player['Total_Goals'], prev?.['Total_Goals']);
        const assistsClass = getChangeClass(player['Total_Assists'], prev?.['Total_Assists']);
        const savesClass = getChangeClass(player['Total_Saves'], prev?.['Total_Saves']);
        const mvpClass = getChangeClass(player['MVP_Count'], prev?.['MVP_Count']);
        const offClass = getChangeClass(player['Offensive_Ratio'], prev?.['Offensive_Ratio']);
        const defClass = getChangeClass(player['Defensive_Ratio'], prev?.['Defensive_Ratio']);
        const playClass = getChangeClass(player['Playmaker_Ratio'], prev?.['Playmaker_Ratio']);
        
        const tr = document.createElement('tr');
        tr.className = "master-row" + (isChanged ? " changed-player" : "");
        $(tr).data('player', player); $(tr).data('prev', prev);

        tr.innerHTML = `
            <td class="col-rank">${realRank}</td>
            <td>
                <div class="col-player">
                    <div>${getFlagHtml(player['Country'])}</div>
                    <div class="player-info">
                        <div class="player-nick">${escapeHtml(player['Nick'])} ${getChangeTag(player['Rating'], prev?.['Rating'], !prev)}</div>
                        <div class="player-user"><a href="https://ffs.gg/members/${escapeHtml(player['UserID'])}" target="_blank">@${escapeHtml(player['SiteName'])}</a></div>
                    </div>
                </div>
            </td>
            <td class="col-role" title="${escapeHtml(player['Role'])}">${getRoleEmoji(player['Role'])}</td>
            <td class="col-rating ${ratingClass}">${escapeHtml(player['Rating'])}</td>
            <td class="col-skill ${skillClass}">${escapeHtml(player['Raw_Skill'])}</td>
            <td class="col-tier"><span class="badge badge-${tierClass}">${escapeHtml(tier)}</span></td>
            <td class="col-stat ${matchesClass}">${escapeHtml(player['Matches'])}</td>
            <td class="col-win ${winsClass}">${escapeHtml(player['Wins'])}</td>
            <td class="col-loss ${lossesClass}">${escapeHtml(player['Losses'])}</td>
            <td class="col-stat ${goalsClass}">${escapeHtml(player['Total_Goals'])}</td>
            <td class="col-stat ${assistsClass}">${escapeHtml(player['Total_Assists'])}</td>
            <td class="col-stat ${savesClass}">${escapeHtml(player['Total_Saves'])}</td>
            <td class="col-stat ${mvpClass}">${escapeHtml(player['MVP_Count'])}</td>
            <td class="col-stat ${offClass}">${escapeHtml(player['Offensive_Ratio'])}%</td>
            <td class="col-stat ${defClass}">${escapeHtml(player['Defensive_Ratio'])}%</td>
            <td class="col-stat ${playClass}">${escapeHtml(player['Playmaker_Ratio'])}%</td>
            <td style="text-align:center; width: 20px;"><span class="expand-icon">▶</span></td>
        `;
        fragment.appendChild(tr);
    });

    tbody.appendChild(fragment);
    
    jQuery.extend(jQuery.fn.dataTable.ext.type.order, {
        'tier-pre': function(data) { const map = { 'S-Tier':1, 'A-Tier':2, 'B-Tier':3, 'C-Tier':4, 'D-Tier':5, 'E-Tier':6 }; return map[String(data).replace(/<[^>]*>/g, '').trim()] || 99; },
        'nick-score-pre': function(data) { const match = String(data).match(/\((\d+)(K)?\)/); return match ? parseInt(match[1]) * (match[2] === 'K' ? 1000 : 1) : 0; },
        'num-fmt-pre': function(data) { return parseFloat(String(data).replace(/<[^>]*>/g, '').replace(/,/g, '').replace(/%/g, '')) || 0; }
    });
    
    dataTable = $('#playersTable').DataTable({
        pageLength: 50, 
        autoWidth: false,
        order: [[0, 'asc']], 
        columnDefs: [
            { type: 'num', targets: 0 },
            { type: 'nick-score', targets: 1 },
            { type: 'string', targets: 2 },
            { type: 'num-fmt', targets: 3 },
            { type: 'num-fmt', targets: 4 },
            { type: 'tier', targets: 5 },
            { type: 'num-fmt', targets: 6 },
            { type: 'num-fmt', targets: 7 },
            { type: 'num-fmt', targets: 8 },
            { type: 'num-fmt', targets: 9 },
            { type: 'num-fmt', targets: 10 },
            { type: 'num-fmt', targets: 11 },
            { type: 'num-fmt', targets: 12 },
            { type: 'num-fmt', targets: 13 },
            { type: 'num-fmt', targets: 14 },
            { type: 'num-fmt', targets: 15 },
            { orderable: false, targets: 16 }
        ],
        dom: 'rt' 
    });

    $('#customSearch').off('input').on('input', function() {
        const val = this.value;
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            dataTable.search(val).draw();
            updateCustomPagination();
            document.getElementById('tableScrollContainer').scrollTop = 0;
        }, 200);
    });

    $('#playersTable tbody').on('click', 'tr.master-row', function () {
        var tr = $(this); var row = dataTable.row(tr);
        if (row.child.isShown()) { row.child.hide(); tr.removeClass('shown expanded-row-bg'); } 
        else {
            dataTable.rows('.shown').nodes().to$().each(function() { dataTable.row(this).child.hide(); $(this).removeClass('shown expanded-row-bg'); });
            row.child(formatChildRow(tr.data('player'), tr.data('prev'))).show(); tr.addClass('shown expanded-row-bg');
            tr[0].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    });

    updateCustomPagination();
    dataTable.on('draw', function () { 
        updateCustomPagination();
        document.getElementById('tableScrollContainer').scrollTop = 0;
    });
}

function updateCustomPagination() {
    let info = dataTable.page.info();
    let container = document.getElementById('customPagination');
    container.innerHTML = `
        <div style="font-size: 0.85rem; color: var(--text-muted);">
            Showing ${info.start + 1} to ${info.end} of ${info.recordsDisplay} players
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="goToPage('previous')" ${info.page === 0 ? 'disabled' : ''} style="background:rgba(24,24,27,0.8); color:white; border:1px solid var(--border-color); padding:4px 12px; border-radius:4px; cursor:${info.page === 0 ? 'not-allowed' : 'pointer'}; opacity:${info.page === 0 ? '0.5' : '1'};">Prev</button>
            <button onclick="goToPage('next')" ${info.page === info.pages - 1 ? 'disabled' : ''} style="background:rgba(24,24,27,0.8); color:white; border:1px solid var(--border-color); padding:4px 12px; border-radius:4px; cursor:${info.page === info.pages - 1 ? 'not-allowed' : 'pointer'}; opacity:${info.page === info.pages - 1 ? '0.5' : '1'};">Next</button>
        </div>
    `;
}

function goToPage(direction) {
    dataTable.page(direction).draw('page');
    document.getElementById('tableScrollContainer').scrollTop = 0;
}

async function loadData() {
    try {
        await loadPreviousData();
        const isLocal = window.location.hostname === 'localhost' || 
                        window.location.hostname === '127.0.0.1' ||
                        window.location.hostname === '';
        
        const url = isLocal 
            ? '../data/players.csv?t=' + new Date().getTime()
            : 'https://raw.githubusercontent.com/pykellog/carball-rating-system/refs/heads/main/data/players.csv?t=' + new Date().getTime();
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const lines = (await res.text()).split('\n').map(l => l.trim()).filter(l => l.length > 0);
        if (lines.length < 3) throw new Error('CSV is empty.');
        
        const updateDate = lines[0].replace(/^"|"$/g, '').replace(/:(\d{2}) UTC$/, ' UTC');
        const playerCount = parseInt(lines[1].replace(/^"|"$/g, '').replace('PlayerCount: ', ''));
        const headers = parseQuotedCSV(lines[2]).map(h => h.replace(/^"|"$/g, ''));
        
        globalPlayers = []; changedPlayers.clear();
        for (let i = 3; i < lines.length; i++) {
            const vals = parseQuotedCSV(lines[i]);
            if (vals.length < 4) continue;
            const p = {}; headers.forEach((h, idx) => p[h] = vals[idx] ? vals[idx].replace(/^"|"$/g, '') : '');
            globalPlayers.push(p);
        }
        
        globalPlayers.forEach((p) => { 
            if (isPlayerChanged(p, findPreviousPlayer(p['Nick'], p['UserID']))) {
                changedPlayers.add(p['Nick']);
            }
        });
        
        document.getElementById('lastUpdate').textContent = updateDate;
        document.getElementById('playerCount').textContent = playerCount;
        document.getElementById('changedCount').textContent = changedPlayers.size;
        
        if (document.getElementById('footerUpdate').textContent === 'Previous Update: -' && previousUpdateDate !== '-') {
            document.getElementById('footerUpdate').textContent = `Previous Update: ${previousUpdateDate}`;
        }
        
        rebuildTable(false);
    } catch (err) { document.getElementById('tableBody').innerHTML = `<tr><td colspan="17" style="padding: 3rem; color: #f87171; text-align: center;">⚠️ Error loading data.<br><small>${err.message}</small></td></tr>`; }
}
$(document).ready(function() { loadData(); });

document.addEventListener("DOMContentLoaded", function () {
    const searchBox = document.getElementById("customSearch");
    let searchTimer;
    if (searchBox) {
        searchBox.addEventListener("input", function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(function () {
                const searchTerm = searchBox.value.trim().toLowerCase();
                if (searchTerm.length >= 2 && window.umami) {
                    umami.track("Canlı Arama", { kelime: searchTerm });
                }
            }, 1500);
        });
    }
});
